name: Publish engineering application bundles
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-engineering.yml
      - delivery/engineering-release/**
      - tools/publish_engineering_github.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engineering-release-v0.8.0-engineering.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_CONFIG_FILE: NUL
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct bundles and publish (no training or simulator tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/publish_engineering_github.py --publish
