name: Publish 0.8.2 engineering hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-hotfix.yml
      - delivery/hotfix-release/0.8.2/**
      - tools/publish_hotfix_github.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.8.2-engineering.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prepared assets
        run: python -X utf8 tools/publish_hotfix_github.py --verify-only
      - name: Publish and verify remote hashes (no training)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/publish_hotfix_github.py --publish
